name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['games/match-pet/iphone/**', '.github/workflows/build-iphone.yml']
permissions:
  contents: write
jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: games/match-pet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check game rules
        run: node --test iphone/tests/engine.test.cjs iphone/tests/v2.test.cjs
      - name: Build device IPA for personal signing
        run: bash iphone/scripts/build-ios.sh
      - name: Start native iPhone simulator and verify local save
        run: bash iphone/scripts/smoke-ios.sh
      - name: Save build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Wangguodong-iPhone-personal-sign
          path: games/match-pet/iphone/out/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the personal-signing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="iphone-3.2.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" iphone/out/Wangguodong-iPhone-3.2.0-personal-sign.ipa iphone/out/build-report.json iphone/out/native-smoke.json iphone/out/iPhone-preview.png iphone/out/INSTALL-WINDOWS.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "iPhone 3.2.0 · 使用自己的 Apple 账号签名安装" --notes-file iphone/INSTALL-WINDOWS.md
      - name: Keep diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iPhone-build-diagnostics
          path: games/match-pet/iphone/.build/*.log
          retention-days: 7

name: Check both games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check both games
        run: npm run check
      - name: Test both games
        run: npm test
      - name: Test the bundled iPhone game rules
        run: node --test games/match-pet/iphone/tests/engine.test.cjs games/match-pet/iphone/tests/v2.test.cjs
